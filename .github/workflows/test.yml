name: Run Go tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-convco

      # older commits don't follow the format, merge commits are skipped
      - run: convco check v0.2.0..HEAD

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
