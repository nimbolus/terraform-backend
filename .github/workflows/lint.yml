name: Run golangci lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 1.24

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
